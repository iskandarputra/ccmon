appId: dev.iskandar.ccmon
productName: ccmon
copyright: © 2026 Iskandar Putra

directories:
  output: release
  buildResources: build

files:
  - dist-electron/**/*
  - dist/renderer/**/*
  - build/icon.png
  - package.json

# The headless CLI ships as a resource, NOT inside the asar: it has a shebang
# and needs to be directly executable, which an asar-packed file is not.
# It lands at <install>/resources/cli/index.cjs.
#
# Deliberately NOT symlinked onto PATH by an install hook: that needs a
# root-run postinstall on deb, has no clean equivalent for AppImage (a
# self-contained mount) and needs a shim plus a PATH edit on Windows. Shipping
# an untested root-run script is worse than asking for one command — see the
# README/docs for the one-liner.
extraResources:
  - from: dist-cli
    to: cli
    filter:
      - '**/*.cjs'

asar: true
compression: normal
npmRebuild: false

linux:
  icon: build/icon.png
  category: Utility
  synopsis: Real-time Claude Code usage monitor
  maintainer: Iskandar Putra <iskandarputra1995@gmail.com>
  target:
    - deb
    - AppImage

deb:
  priority: optional

win:
  icon: build/icon.png
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip

artifactName: ${name}-${version}-${os}-${arch}.${ext}
